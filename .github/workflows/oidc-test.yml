
name: AWS OIDC Authentication Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oidc-test:
    name: Test AWS OIDC Authentication
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Diagnose the GitHub OIDC token claims
      - name: Debug OIDC Claims
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS --get \
            --data-urlencode "audience=sts.amazonaws.com" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")

          TOKEN=$(echo "$RESPONSE" | jq -er '.value')

          export TOKEN

          python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in ("iss", "aud", "sub"):
              print(f"{key}: {claims.get(key)}")
          PY

      # Step 3: Authenticate to AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::877710816445:role/GitHubActionsOIDCRole
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-session-name: GitHubActionsOIDCSession

      # Step 4: Verify AWS identity
      - name: Verify AWS Identity
        run: aws sts get-caller-identity
